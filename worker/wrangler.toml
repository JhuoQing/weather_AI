name = "weather-ai"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# 允許呼叫的網頁來源（只寫網域，不含路徑）。多個用逗號分隔。
# 本機測試用 http://localhost:8000 。
ALLOWED_ORIGIN = "https://jhuoqing.github.io,http://localhost:8000"
# 使用的模型。想換更強或更省的模型，改這裡即可。
MODEL = "claude-haiku-5-5"

# 金鑰不要寫在這個檔案。請用指令存成 Secret：
#   npx wrangler secret put ANTHROPIC_API_KEY
