name = "weather-ai"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGIN = "https://jhuoqing.github.io,http://localhost:8000"
MODEL = "claude-haiku-5-5"

# 台灣時間 07:00、12:00、18:00 更新（Cloudflare 以 UTC 計時）
[triggers]
crons = ["0 23,4,10 * * *"]

# 先執行：npx wrangler kv namespace create WX_KV  ，再把印出的 id 貼到這裡
[[kv_namespaces]]
binding = "WX_KV"
id = "REPLACE_WITH_KV_ID"

# 金鑰請用 wrangler secret put 設定，不要寫在這個檔案：
#   CWA_API_KEY、ANTHROPIC_API_KEY、REFRESH_TOKEN（選填）
